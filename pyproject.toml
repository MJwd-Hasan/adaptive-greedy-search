[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-greedy-search"
version = "3.6.0"
description = "Adaptive Greedy Search: surrogate-assisted multi-start hyperparameter optimization with adaptive trust regions, multi-fidelity racing, and diversity-aware batch search."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mohammad Jawad Hasan"}
]
requires-python = ">=3.8"
keywords = ["hyperparameter-optimization", "machine-learning", "scikit-learn", "AutoML", "Random Forest", "Bayesian optimization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20",
    "scikit-learn>=1.0",
    "joblib>=1.0",
]

[project.urls]
Homepage = "https://github.com/MJwd-Hasan/adaptive-greedy-search"
Repository = "https://github.com/MJwd-Hasan/adaptive-greedy-search"

[tool.setuptools]
packages = ["ags"]
