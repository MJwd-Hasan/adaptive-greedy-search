name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Publish release"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate released version and PyPI state
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          INIT_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("ags/__init__.py").read_text(encoding="utf-8")
          print(re.search(r'^__version__\s*=\s*["\x27]([^"\x27]+)', text, re.M).group(1))
          PY
          )"
          test "$VERSION" = "$INIT_VERSION" || { echo "Version mismatch"; exit 1; }
          git fetch --tags --force
          git rev-parse "v$VERSION" >/dev/null 2>&1 || {
            echo "No GitHub release tag v$VERSION; refusing PyPI publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl --fail --silent "https://pypi.org/pypi/adaptive-greedy-search/$VERSION/json" >/dev/null; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tool
        if: steps.version.outputs.should_publish == 'true'
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        if: steps.version.outputs.should_publish == 'true'
        run: python -m build

      - name: Upload build artifacts
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/adaptive-greedy-search/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
